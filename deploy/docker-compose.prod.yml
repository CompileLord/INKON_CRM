name: ${COMPOSE_PROJECT_NAME:-imkon}

x-backend-service: &backend-service
  image: ghcr.io/compilelord/inkon_crm-api:${IMAGE_TAG:?IMAGE_TAG must be set}
  env_file: /etc/imkon/backend.env
  restart: unless-stopped
  deploy:
    replicas: 1
  environment:
    DB_API_PROCESSES: "1"
    DB_WORKER_PROCESSES: "1"
    DB_REVISION_OVERLAP: "2"
  networks:
    - internal
    - edge
  volumes:
    - ${IMKON_DATA_DIR:-/var/lib/imkon}/storage:/app/storage
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  caddy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-api-crm.kitobedu.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${IMKON_DATA_DIR:-/var/lib/imkon}/caddy:/data
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *backend-service
    command: ["sh", "-c", "exec uvicorn app.main:app --host 0.0.0.0 --port 8080 --workers 1"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *backend-service
    command: ["arq", "app.workers.settings.WorkerSettings"]
    healthcheck:
      test: ["CMD", "arq", "--check", "app.workers.settings.WorkerSettings"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    command: ["postgres", "-c", "max_connections=100"]
    restart: unless-stopped
    env_file: /etc/imkon/backend.env
    volumes:
      - ${IMKON_DATA_DIR:-/var/lib/imkon}/postgres:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    env_file: /etc/imkon/backend.env
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - ${IMKON_DATA_DIR:-/var/lib/imkon}/redis:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  internal:
    internal: true
  edge:
