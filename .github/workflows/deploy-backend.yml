name: Deploy Backend

on:
  workflow_run:
    workflows: ["Build Image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true
      sha:
        description: Full commit SHA of an image already pushed to GHCR
        required: true

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    name: Resolve target
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Checkout release verification script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          sparse-checkout: deploy

      - name: Determine environment and commit
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_SHA: ${{ inputs.sha }}
          BUILD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            environment="$INPUT_ENVIRONMENT"
            sha="$INPUT_SHA"
          else
            head_branch="$BUILD_BRANCH"
            sha="$BUILD_SHA"
            case "$head_branch" in
              main) environment=staging ;;
              v*) environment=production ;;
              *) echo "Unsupported ref: $head_branch" >&2; exit 1 ;;
            esac
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          bash deploy/verify-release.sh "$sha"
          echo "environment=${environment}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to ${{ needs.resolve.outputs.environment }}
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    concurrency:
      group: deploy-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ needs.resolve.outputs.sha }}
      DEPLOY_ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
    steps:
      - name: Checkout deploy files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          sparse-checkout: deploy

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload deploy files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          tar -C deploy -cf - . | ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" 'mkdir -p /opt/imkon/deploy && tar -xf - -C /opt/imkon/deploy'

      - name: Run connection-budget-validated deploy script
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "/opt/imkon/deploy/deploy.sh $DEPLOY_SHA"

      - name: Register Telegram webhook
        if: env.DEPLOY_ENVIRONMENT == 'production'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "/opt/imkon/deploy/deploy.sh --register-webhook"
