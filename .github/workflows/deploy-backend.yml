name: Backend CI/CD to Google Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  test:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linguist_user
          POSTGRES_PASSWORD: linguist_pass_2024
          POSTGRES_DB: imkon_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        run: |
          cd backend
          python -m pytest app/tests -q

  deploy:
    name: Deploy to Google Cloud Run (Always Free Tier)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      REGION: 'us-central1'
      SERVICE_NAME: 'imkon-backend'
      REPOSITORY: 'imkon-backend'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry Repository Exists
        run: |
          gcloud artifacts repositories describe ${{ env.REPOSITORY }} \
            --location=${{ env.REGION }} --format='value(name)' 2>/dev/null || \
          gcloud artifacts repositories create ${{ env.REPOSITORY }} \
            --repository-format=docker \
            --location=${{ env.REGION }} \
            --description="IMKON CRM Backend Container Repository"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ steps.auth.outputs.project_id }}/${{ env.REPOSITORY }}/app:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ steps.auth.outputs.project_id }}/${{ env.REPOSITORY }}/app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Python for Database Migration
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Database Migrations (Pre-deploy)
        if: ${{ secrets.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd backend
          python -m pip install alembic asyncpg sqlalchemy psycopg2-binary
          alembic upgrade head || echo "Migration warning: ensure database is reachable from CI runner or execute via Cloud Run Job."

      - name: Deploy to Cloud Run (Always Free: 512MB RAM, 1 vCPU, Scale to 0)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ steps.auth.outputs.project_id }}/${{ env.REPOSITORY }}/app:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: >-
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=2
            --port=8080
            --allow-unauthenticated
            --no-cpu-throttling=false
          env_vars: >-
            ENVIRONMENT=production,
            DATABASE_URL=${{ secrets.DATABASE_URL }},
            REDIS_URL=${{ secrets.REDIS_URL }},
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }},
            JWT_REFRESH_SECRET_KEY=${{ secrets.JWT_REFRESH_SECRET_KEY }},
            SMTP_HOST=${{ secrets.SMTP_HOST }},
            SMTP_PORT=${{ secrets.SMTP_PORT }},
            SMTP_USER=${{ secrets.SMTP_USER }},
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }},
            SMTP_FROM_EMAIL=${{ secrets.SMTP_FROM_EMAIL }},
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }},
            TELEGRAM_BOT_SECRET_TOKEN=${{ secrets.TELEGRAM_BOT_SECRET_TOKEN }},
            GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }},
            CRON_SECRET=${{ secrets.CRON_SECRET }}

      - name: Prune Old Images to stay within 0.5 GB Free Tier
        if: always()
        run: |
          echo "Cleaning older image digests in Artifact Registry..."
          TAGS_TO_DELETE=$(gcloud artifacts docker images list \
            ${{ env.REGION }}-docker.pkg.dev/${{ steps.auth.outputs.project_id }}/${{ env.REPOSITORY }}/app \
            --sort-by="~CREATE_TIME" \
            --format="value(DIGEST)" | tail -n +4 || true)
          for DIGEST in $TAGS_TO_DELETE; do
            if [ -n "$DIGEST" ]; then
              gcloud artifacts docker images delete \
                "${{ env.REGION }}-docker.pkg.dev/${{ steps.auth.outputs.project_id }}/${{ env.REPOSITORY }}/app@${DIGEST}" \
                --delete-tags --quiet || true
            fi
          done

      - name: Deployment Summary
        run: |
          echo "======================================================"
          echo "Backend deployed successfully to Google Cloud Run!"
          echo "Service URL: ${{ steps.deploy.outputs.url }}"
          echo "API Docs:    ${{ steps.deploy.outputs.url }}/docs"
          echo "Healthcheck: ${{ steps.deploy.outputs.url }}/health"
          echo "======================================================"
