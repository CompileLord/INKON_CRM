name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'CONTRACT.md'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend-lint:
    name: Backend lint
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "ruff>=0.6.0"
      - run: ruff check backend

  backend-test:
    name: Backend tests
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENVIRONMENT: testing
      TESTING: 'true'
      TEST_DATABASE_URL: postgresql+asyncpg://linguist_user:linguist_pass_2024@localhost:5432/imkon_test_db
      TEST_REDIS_URL: redis://localhost:6379/15
      DATABASE_URL: postgresql+asyncpg://linguist_user:linguist_pass_2024@localhost:5432/imkon_test_db
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET_KEY: test-only-jwt-secret-key-for-ci-00000000000000000000000000000000
      JWT_REFRESH_SECRET_KEY: test-only-jwt-refresh-key-for-ci-000000000000000000000000000000
      SMTP_HOST: smtp.invalid
      SMTP_USER: test-only@example.invalid
      SMTP_PASSWORD: test-only-smtp-placeholder
      SMTP_FROM_EMAIL: test-only@example.invalid
      TELEGRAM_BOT_TOKEN: 123456789:test_only_ci_token_0000000000000000
      TELEGRAM_BOT_SECRET_TOKEN: test-only-telegram-webhook-secret

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linguist_user
          POSTGRES_PASSWORD: linguist_pass_2024
          POSTGRES_DB: imkon_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Install isolated Redis and TLS test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes redis-server openssl
      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Run pytest
        working-directory: backend
        run: python -m pytest app/tests -q

  migrations-check:
    name: Migrations check
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: testing
      TESTING: 'true'
      TEST_DATABASE_URL: postgresql+asyncpg://linguist_user:linguist_pass_2024@localhost:5432/imkon_test_db
      TEST_REDIS_URL: redis://localhost:6379/15
      DATABASE_URL: postgresql+asyncpg://linguist_user:linguist_pass_2024@localhost:5432/imkon_test_db
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET_KEY: test-only-jwt-secret-key-for-ci-00000000000000000000000000000000
      JWT_REFRESH_SECRET_KEY: test-only-jwt-refresh-key-for-ci-000000000000000000000000000000
      SMTP_HOST: smtp.invalid
      SMTP_USER: test-only@example.invalid
      SMTP_PASSWORD: test-only-smtp-placeholder
      SMTP_FROM_EMAIL: test-only@example.invalid
      TELEGRAM_BOT_TOKEN: 123456789:test_only_ci_token_0000000000000000
      TELEGRAM_BOT_SECRET_TOKEN: test-only-telegram-webhook-secret

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linguist_user
          POSTGRES_PASSWORD: linguist_pass_2024
          POSTGRES_DB: imkon_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Upgrade to head
        working-directory: backend
        run: alembic upgrade head
      - name: Check models match migrations
        working-directory: backend
        run: alembic check
      - name: Downgrade one revision and upgrade again
        working-directory: backend
        run: |
          alembic downgrade -1
          alembic upgrade head

  contract-check:
    name: Contract drift
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: testing
      TESTING: 'true'
      TEST_DATABASE_URL: postgresql+asyncpg://linguist_user:linguist_pass_2024@localhost:5432/imkon_test_db
      TEST_REDIS_URL: redis://localhost:6379/15
      DATABASE_URL: postgresql+asyncpg://linguist_user:linguist_pass_2024@localhost:5432/imkon_test_db
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET_KEY: test-only-jwt-secret-key-for-ci-00000000000000000000000000000000
      JWT_REFRESH_SECRET_KEY: test-only-jwt-refresh-key-for-ci-000000000000000000000000000000
      SMTP_HOST: smtp.invalid
      SMTP_USER: test-only@example.invalid
      SMTP_PASSWORD: test-only-smtp-placeholder
      SMTP_FROM_EMAIL: test-only@example.invalid
      TELEGRAM_BOT_TOKEN: 123456789:test_only_ci_token_0000000000000000
      TELEGRAM_BOT_SECRET_TOKEN: test-only-telegram-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Regenerate CONTRACT.md
        working-directory: backend
        run: python -m scripts.generate_contract
      - name: Fail on drift
        run: git diff --exit-code CONTRACT.md

  frontend:
    name: Frontend
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint (known baseline failures on main)
        run: npm run lint
        continue-on-error: true
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  docker-build:
    name: Backend image build
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          load: true
          tags: imkon-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: imkon-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pip-audit (known unfixed python-jose/ecdsa advisories on main)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (known high advisories on main)
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true
