name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  deployment-tests:
    name: Deployment regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check shell syntax and deployment behavior
        run: |
          while IFS= read -r shell_file; do
            bash -n "$shell_file"
          done < <(find deploy -name '*.sh' -type f)
          bash deploy/tests/regression.sh

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'CONTRACT.md'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend-lint:
    name: Backend lint
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r backend/requirements-ci.lock
      - run: ruff check backend

  backend-test:
    name: Backend tests
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENVIRONMENT: testing
      TESTING: 'true'
      TEST_DATABASE_URL: postgresql+asyncpg://linguist_user:linguist_pass_2024@localhost:5432/imkon_test_db
      TEST_REDIS_URL: redis://localhost:6379/15
      DATABASE_URL: postgresql+asyncpg://linguist_user:linguist_pass_2024@localhost:5432/imkon_test_db
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET_KEY: test-only-jwt-secret-key-for-ci-00000000000000000000000000000000
      JWT_REFRESH_SECRET_KEY: test-only-jwt-refresh-key-for-ci-000000000000000000000000000000
      SMTP_HOST: smtp.invalid
      SMTP_USER: test-only@example.invalid
      SMTP_PASSWORD: test-only-smtp-placeholder
      SMTP_FROM_EMAIL: test-only@example.invalid
      TELEGRAM_BOT_TOKEN: 123456789:test_only_ci_token_0000000000000000
      TELEGRAM_BOT_SECRET_TOKEN: test-only-telegram-webhook-secret

    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: linguist_user
          POSTGRES_PASSWORD: linguist_pass_2024
          POSTGRES_DB: imkon_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install dependencies
        run: |
          pip install --require-hashes -r backend/requirements.lock
      - name: Install isolated Redis and TLS test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes redis-server openssl
      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Run pytest
        working-directory: backend
        run: python -m pytest app/tests -q

  migrations-check:
    name: Migrations check
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: testing
      TESTING: 'true'
      TEST_DATABASE_URL: postgresql+asyncpg://linguist_user:linguist_pass_2024@localhost:5432/imkon_test_db
      TEST_REDIS_URL: redis://localhost:6379/15
      DATABASE_URL: postgresql+asyncpg://linguist_user:linguist_pass_2024@localhost:5432/imkon_test_db
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET_KEY: test-only-jwt-secret-key-for-ci-00000000000000000000000000000000
      JWT_REFRESH_SECRET_KEY: test-only-jwt-refresh-key-for-ci-000000000000000000000000000000
      SMTP_HOST: smtp.invalid
      SMTP_USER: test-only@example.invalid
      SMTP_PASSWORD: test-only-smtp-placeholder
      SMTP_FROM_EMAIL: test-only@example.invalid
      TELEGRAM_BOT_TOKEN: 123456789:test_only_ci_token_0000000000000000
      TELEGRAM_BOT_SECRET_TOKEN: test-only-telegram-webhook-secret

    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: linguist_user
          POSTGRES_PASSWORD: linguist_pass_2024
          POSTGRES_DB: imkon_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install dependencies
        run: |
          pip install --require-hashes -r backend/requirements.lock
      - name: Upgrade to head
        working-directory: backend
        run: alembic upgrade head
      - name: Check models match migrations
        working-directory: backend
        run: alembic check
      - name: Downgrade one revision and upgrade again
        working-directory: backend
        run: |
          alembic downgrade -1
          alembic upgrade head

  contract-check:
    name: Contract drift
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: testing
      TESTING: 'true'
      TEST_DATABASE_URL: postgresql+asyncpg://linguist_user:linguist_pass_2024@localhost:5432/imkon_test_db
      TEST_REDIS_URL: redis://localhost:6379/15
      DATABASE_URL: postgresql+asyncpg://linguist_user:linguist_pass_2024@localhost:5432/imkon_test_db
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET_KEY: test-only-jwt-secret-key-for-ci-00000000000000000000000000000000
      JWT_REFRESH_SECRET_KEY: test-only-jwt-refresh-key-for-ci-000000000000000000000000000000
      SMTP_HOST: smtp.invalid
      SMTP_USER: test-only@example.invalid
      SMTP_PASSWORD: test-only-smtp-placeholder
      SMTP_FROM_EMAIL: test-only@example.invalid
      TELEGRAM_BOT_TOKEN: 123456789:test_only_ci_token_0000000000000000
      TELEGRAM_BOT_SECRET_TOKEN: test-only-telegram-webhook-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install dependencies
        run: |
          pip install --require-hashes -r backend/requirements.lock
      - name: Regenerate CONTRACT.md
        working-directory: backend
        run: python -m scripts.generate_contract
      - name: Fail on drift
        run: git diff --exit-code CONTRACT.md

  frontend:
    name: Frontend
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint (known baseline failures on main)
        run: npm run lint
        continue-on-error: true
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  docker-build:
    name: Backend image build
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: backend
          push: false
          load: true
          tags: imkon-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: imkon-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: pip-audit (known unfixed python-jose/ecdsa advisories on main)
        run: |
          pip install --require-hashes -r backend/requirements-ci.lock
          pip-audit --require-hashes -r backend/requirements.lock
        continue-on-error: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: npm audit (known high advisories on main)
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true
