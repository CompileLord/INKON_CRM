name: Build Image

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  build:
    name: Build and push backend image
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    env:
      IMAGE_NAME: ghcr.io/compilelord/inkon_crm-api
    steps:
      - name: Resolve commit and floating tag
        id: refs
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "floating_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${CI_SHA}" >> "$GITHUB_OUTPUT"
            echo "floating_tag=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release verification script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          sparse-checkout: deploy

      - name: Require main ancestry and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.refs.outputs.sha }}
        run: bash deploy/verify-release.sh "$RELEASE_SHA"

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.refs.outputs.sha }}
          fetch-depth: 1

      - name: Resolve build metadata
        id: build_metadata
        env:
          RESOLVED_SHA: ${{ steps.refs.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${EVENT_NAME}" = "push" ] && [ "${REF_TYPE}" = "tag" ]; then
            build_version="${REF_NAME#v}"
          else
            build_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' backend/pyproject.toml | head -n 1)"
          fi
          {
            echo "version=${build_version}"
            echo "commit_sha=${RESOLVED_SHA}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit_message=$(git log -1 --format=%s "${RESOLVED_SHA}")"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.refs.outputs.sha }}
            ${{ env.IMAGE_NAME }}:${{ steps.refs.outputs.floating_tag }}
          build-args: |
            BUILD_VERSION=${{ steps.build_metadata.outputs.version }}
            BUILD_COMMIT_SHA=${{ steps.build_metadata.outputs.commit_sha }}
            BUILD_COMMIT_MESSAGE=${{ steps.build_metadata.outputs.commit_message }}
            BUILD_TIME=${{ steps.build_metadata.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
