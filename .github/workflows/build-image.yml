name: Build Image

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push backend image
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    env:
      IMAGE_NAME: ghcr.io/compilelord/inkon_crm-api
    steps:
      - name: Resolve commit and floating tag
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "floating_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "floating_tag=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.sha }}
          fetch-depth: 1

      - name: Resolve build metadata
        id: build_metadata
        env:
          RESOLVED_SHA: ${{ steps.refs.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${EVENT_NAME}" = "push" ] && [ "${REF_TYPE}" = "tag" ]; then
            build_version="${REF_NAME#v}"
          else
            build_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' backend/pyproject.toml | head -n 1)"
          fi
          {
            echo "version=${build_version}"
            echo "commit_sha=${RESOLVED_SHA}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit_message=$(git log -1 --format=%s "${RESOLVED_SHA}")"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.refs.outputs.sha }}
            ${{ env.IMAGE_NAME }}:${{ steps.refs.outputs.floating_tag }}
          build-args: |
            BUILD_VERSION=${{ steps.build_metadata.outputs.version }}
            BUILD_COMMIT_SHA=${{ steps.build_metadata.outputs.commit_sha }}
            BUILD_COMMIT_MESSAGE=${{ steps.build_metadata.outputs.commit_message }}
            BUILD_TIME=${{ steps.build_metadata.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
