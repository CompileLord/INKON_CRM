name: Build Image

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push backend image
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    env:
      IMAGE_NAME: ghcr.io/compilelord/inkon_crm-api
    steps:
      - name: Resolve commit and floating tag
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "floating_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "floating_tag=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.refs.outputs.sha }}
            ${{ env.IMAGE_NAME }}:${{ steps.refs.outputs.floating_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
