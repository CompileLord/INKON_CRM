name: Deploy Frontend

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'CONTRACT.md'
      - '.github/workflows/deploy-frontend.yml'
  workflow_run:
    workflows: ['Deploy Backend']
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options:
          - production
          - staging
        default: production

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || (github.event_name == 'workflow_run' && 'production') || (github.event_name == 'workflow_dispatch' && inputs.environment) || 'staging' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  target:
    name: Resolve deployment target
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    environment: ${{ (github.event_name == 'workflow_run' && 'production') || (github.event_name == 'workflow_dispatch' && inputs.environment) || 'staging' }}
    permissions: {}
    outputs:
      api_base_url: ${{ steps.values.outputs.api_base_url }}
    steps:
      - name: Expose environment variable
        id: values
        env:
          API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [ -z "${API_BASE_URL}" ]; then
            echo "VITE_API_BASE_URL is empty: set it as a variable on this GitHub Environment" >&2
            exit 1
          fi
          echo "api_base_url=${API_BASE_URL}" >> "$GITHUB_OUTPUT"

  build:
    name: Build frontend without deployment credentials
    needs: target
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_API_BASE_URL: ${{ needs.target.outputs.api_base_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: frontend
        run: npx vitest run

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Verify build output
        run: |
          test -f frontend/dist/index.html || { echo "dist/index.html missing" >&2; exit 1; }
          test -f frontend/dist/_redirects || { echo "dist/_redirects missing" >&2; exit 1; }
          test -f frontend/dist/_headers || { echo "dist/_headers missing" >&2; exit 1; }

      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [target, build]
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'workflow_run' && 'production') || (github.event_name == 'workflow_dispatch' && inputs.environment) || 'staging' }}
    permissions:
      contents: read
      pull-requests: write
    env:
      PROJECT_NAME: imkon-crm
      DEPLOY_BRANCH: ${{ (github.event_name == 'pull_request' && format('pr-{0}', github.event.number)) || (github.event_name == 'workflow_run' && 'main') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && 'main') || 'staging' }}

    steps:
      - name: Download build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: frontend-dist
          path: dist

      - name: Deploy to Cloudflare Pages
        id: pages_deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          wranglerVersion: '4.151.3'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PROJECT_NAME }} --branch=${{ env.DEPLOY_BRANCH }} --commit-hash=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }} --commit-dirty=true

      - name: Comment preview URL on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          PREVIEW_URL: ${{ steps.pages_deploy.outputs.pages-deployment-alias-url || steps.pages_deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- frontend-preview -->';
            const body = `${marker}\nFrontend preview (staging API): ${process.env.PREVIEW_URL}\n\nCommit: ${context.payload.pull_request.head.sha}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Deployment summary
        run: |
          {
            echo "### Frontend deployed"
            echo "- Branch: ${DEPLOY_BRANCH}"
            echo "- Deployment: ${{ steps.pages_deploy.outputs.deployment-url }}"
            echo "- Alias: ${{ steps.pages_deploy.outputs.pages-deployment-alias-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
