<div class="flex items-center gap-gutter">

<span class="flex items-center gap-1"><span class="material-symbols-outlined text-sm">call</span> +992 93 765 4321</span>
</div>
</div>
</div>
<button class="px-6 py-2 bg-error-container text-on-error-container font-label-md text-label-md rounded-full hover:bg-error hover:text-on-error transition-colors shrink-0">
                        Деактивировать
                    </button>

</div>

<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded bg-surface-container flex items-center justify-center text-on-surface-variant">
