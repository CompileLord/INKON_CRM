<!DOCTYPE html>

        body { font-family: 'Inter', sans-serif; background-color: #FAF9F6; color: #1a1c1a; }

<body class="bg-background flex overflow-hidden h-screen text-on-surface">
<!-- SideNavBar -->
<nav class="bg-surface dark:bg-surface w-[240px] h-full fixed left-0 top-0 border-r border-outline-variant dark:border-outline flex flex-col py-gutter px-4 z-50">

<span class="font-h1 text-h1 text-primary dark:text-primary-fixed">ИМКОН</span>
</div>
<!-- Main Nav -->
<div class="flex-1 flex flex-col gap-2">
<!-- Active: Дашборд -->
<a class="bg-surface-container-high text-secondary font-bold rounded-full px-4 py-2 flex items-center gap-3 transition-transform duration-200 hover:bg-surface-container-low active:scale-90 scale-95" href="#" style="transform: scale(1);">
<span class="material-symbols-outlined text-[24px]">dashboard</span>
<span class="text-label-md font-label-md">Дашборд</span>
</a>
<!-- Inactive: Курсы -->
<a class="text-on-surface-variant hover:text-on-surface px-4 py-2 rounded-full flex items-center gap-3 transition-colors duration-200 hover:bg-surface-container-low active:scale-90 scale-95" href="#" style="transform: scale(1);">
<span class="material-symbols-outlined text-[24px]">school</span>
<span class="text-label-md font-label-md">Курсы</span>
</a>
<!-- Inactive: Журналы -->
<a class="text-on-surface-variant hover:text-on-surface px-4 py-2 rounded-full flex items-center gap-3 transition-colors duration-200 hover:bg-surface-container-low active:scale-90 scale-95" href="#" style="transform: scale(1);">
<span class="material-symbols-outlined text-[24px]">menu_book</span>
<span class="text-label-md font-label-md">Журналы</span>
</a>
</div>
<!-- Footer Nav -->
<div class="mt-auto">
<!-- Inactive: Настройки -->
<a class="text-on-surface-variant hover:text-on-surface px-4 py-2 rounded-full flex items-center gap-3 transition-colors duration-200 hover:bg-surface-container-low active:scale-90 scale-95" href="#" style="transform: scale(1);">
<span class="material-symbols-outlined text-[24px]">settings</span>
<span class="text-label-md font-label-md">Настройки</span>
</a>
</div>
</nav>
<!-- TopNavBar -->
<header class="bg-surface dark:bg-surface h-16 w-full fixed top-0 z-40 border-b border-outline-variant dark:border-outline flex justify-between items-center px-gutter ml-[240px]" style="width: calc(100% - 240px);">
<!-- Left: Search Bar -->
<div class="flex-1 max-w-md ml-4">
<div class="relative flex items-center w-full h-10 rounded-[10px] bg-surface-container-lowest border border-surface-variant focus-within:border-secondary transition-colors duration-200 overflow-hidden">
<div class="grid place-items-center h-full w-10 text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">search</span>
</div>
<input class="peer h-full w-full outline-none text-sm text-on-surface pr-2 bg-transparent placeholder-on-surface-variant" id="search" placeholder="Поиск..." type="text"/>
</div>
</div>
<!-- Right: User Profile -->
<div class="flex items-center gap-4 mr-4">
<div class="flex items-center gap-3 hover:bg-surface-container-low px-3 py-1.5 rounded-full cursor-pointer transition-colors">
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-bold text-sm">
                    МЮ
                </div>
<span class="text-label-md font-label-md text-on-surface">Малика Ю.</span>
</div>
</div>
</header>

<main class="flex-1 ml-[240px] mt-16 p-8 overflow-y-auto">
<div class="max-w-[1440px] mx-auto pt-6 px-4">
<div class="mb-8">
<h1 class="text-section-heading font-section-heading text-on-surface mb-2">Ваши курсы сегодня</h1>
<p class="text-body-lg text-on-surface-variant">Управляйте своими предстоящими занятиями и журналами.</p>
</div>
<!-- Course Cards Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
<!-- Card 1 -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-[16px] p-6 flex flex-col shadow-sm hover:shadow-md transition-shadow duration-300">
<div class="flex justify-between items-start mb-4">
<div>
<h2 class="text-card-subheading font-card-subheading text-on-surface mb-1">SAT Math Prep</h2>
<div class="flex items-center gap-2 text-on-surface-variant text-label-md">
<span class="material-symbols-outlined text-[16px]">calendar_today</span>
<span>Пн, Ср, Пт · 18:00</span>
</div>
</div>
<div class="bg-surface-container-low px-3 py-1 rounded-full text-label-md font-medium text-on-surface-variant border border-surface-variant">
                            14 студентов
                        </div>
</div>
<div class="mt-auto pt-6">
<button class="w-full py-2.5 px-4 bg-[#FDEAE0] text-[#EA5B24] rounded-full text-label-md font-label-md font-semibold hover:bg-[#FCDFD1] transition-colors flex items-center justify-center gap-2">
<span>Открыть журнал</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</div>
<!-- Card 2 -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-[16px] p-6 flex flex-col shadow-sm hover:shadow-md transition-shadow duration-300">

<div>
<h2 class="text-card-subheading font-card-subheading text-on-surface mb-1">IELTS Intensive</h2>
<div class="flex items-center gap-2 text-on-surface-variant text-label-md">
<span class="material-symbols-outlined text-[16px]">calendar_today</span>
<span>Вт, Чт · 16:00</span>
</div>
</div>
<div class="bg-surface-container-low px-3 py-1 rounded-full text-label-md font-medium text-on-surface-variant border border-surface-variant">
                            9 студентов
                        </div>
</div>
<div class="mt-auto pt-6">
<button class="w-full py-2.5 px-4 bg-[#FDEAE0] text-[#EA5B24] rounded-full text-label-md font-label-md font-semibold hover:bg-[#FCDFD1] transition-colors flex items-center justify-center gap-2">
<span>Открыть журнал</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</div>
</div>
</div>
